[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xau-detective-ai"
version = "0.1.0"
description = "Evidence-driven XAUUSD trading research and decision-support system."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<10",
  "ruff==0.16.9",
]
mt5 = [
  "MetaTrader5>=5.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F"]

[tool.setuptools.packages.find]
where = ["src"]
